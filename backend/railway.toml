# Railway: set the service Root Directory to ``backend`` in the dashboard (not repo root).
# Dockerfile path can be ``backend/Dockerfile`` (from repo) or ``Dockerfile`` (under that root).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
